<!doctype html>
<html lang="pl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PokéKolekcja</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f4f4f7;--fg:#1b1b24;--card:#fff;--mut:#6c6c7a;--ac:#e3350d;--on:#ffe6df;--bd:#dcdce4}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14141a;--fg:#ececf2;--card:#21212b;--mut:#9a9aaa;--on:#4a2218;--bd:#33333f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14141a;--fg:#ececf2;--card:#21212b;--mut:#9a9aaa;--on:#4a2218;--bd:#33333f;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:12px 12px 84px}
h1{font-size:20px;margin:0 0 4px}
.bar{height:8px;background:var(--bd);border-radius:4px;overflow:hidden;margin:6px 0 10px}
.bar i{display:block;height:100%;background:var(--ac);width:0}
input{width:100%;padding:11px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--fg);font-size:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:8px;margin-top:10px}
.t{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:8px 6px;text-align:center;cursor:pointer;color:var(--fg);font:inherit}
.t.on{background:var(--on);border-color:var(--ac)}
.t img{display:block;margin:0 auto;width:80px;height:80px;image-rendering:pixelated}
.t b{display:block;font-size:12px;color:var(--mut)}
.t span{display:block;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.d{display:flex;justify-content:center;gap:3px;margin-top:5px}
.d u{text-decoration:none;font-size:10px;width:17px;height:17px;line-height:17px;border-radius:50%;background:var(--bd);color:var(--mut)}
.d u.y{background:var(--ac);color:#fff}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;padding:14px 0;border:0;background:none;color:var(--mut);font-size:15px}
nav button.a{color:var(--ac);font-weight:600}
video{width:100%;max-height:55vh;background:#000;border-radius:12px;object-fit:cover}
.btn{padding:10px 14px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--fg);font-size:15px}
#m{position:fixed;inset:0;background:#0007;display:none;align-items:flex-end;justify-content:center;z-index:5}
#m.o{display:flex}
#sh{background:var(--card);width:100%;max-width:520px;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
.v{display:flex;justify-content:space-between;align-items:center;width:100%;margin-top:8px;padding:14px;border-radius:12px;border:2px solid var(--bd);background:var(--bg);color:var(--fg);font-size:16px}
.v.y{border-color:var(--ac);background:var(--on)}
.hide{display:none}
.mut{color:var(--mut);font-size:13px}
</style></head><body>
<section id="c">
<h1>PokéKolekcja</h1>
<div id="cnt" class="mut"></div><div class="bar"><i id="pb"></i></div>
<input id="q" placeholder="Szukaj nazwy lub numeru" autocomplete="off">
<div class="grid" id="g"></div>
</section>
<section id="s" class="hide">
<h1>Skanuj kartę</h1>
<video id="v" playsinline muted></video>
<p id="msg" class="mut"></p>
<button class="btn" id="cb">📷 Zezwól na aparat</button> <button class="btn hide" id="ob">↗ Otwórz w pełnej karcie</button> <button class="btn" id="sw">🔄 Zmień kamerę</button>
<input id="f" placeholder="Albo wpisz nazwę Pokémona" autocomplete="off" style="margin-top:10px">
<div class="grid" id="fr"></div>
</section>
<nav><button id="n0" class="a">📚 Kolekcja</button><button id="n1">📷 Skanuj</button></nav>
<div id="m"><div id="sh"></div></div>
<script>
const G=[
`bulbasaur ivysaur venusaur charmander charmeleon charizard squirtle wartortle blastoise caterpie metapod butterfree weedle kakuna beedrill pidgey pidgeotto pidgeot rattata raticate spearow fearow ekans arbok pikachu raichu sandshrew sandslash nidoran-f nidorina nidoqueen nidoran-m nidorino nidoking clefairy clefable vulpix ninetales jigglypuff wigglytuff zubat golbat oddish gloom vileplume paras parasect venonat venomoth diglett dugtrio meowth persian psyduck golduck mankey primeape growlithe arcanine poliwag poliwhirl poliwrath abra kadabra alakazam machop machoke machamp bellsprout weepinbell victreebel tentacool tentacruel geodude graveler golem ponyta rapidash slowpoke slowbro magnemite magneton farfetchd doduo dodrio seel dewgong grimer muk shellder cloyster gastly haunter gengar onix drowzee hypno krabby kingler voltorb electrode exeggcute exeggutor cubone marowak hitmonlee hitmonchan lickitung koffing weezing rhyhorn rhydon chansey tangela kangaskhan horsea seadra goldeen seaking staryu starmie mr-mime scyther jynx electabuzz magmar pinsir tauros magikarp gyarados lapras ditto eevee vaporeon jolteon flareon porygon omanyte omastar kabuto kabutops aerodactyl snorlax articuno zapdos moltres dratini dragonair dragonite mewtwo mew`,

`sprigatito floragato meowscarada fuecoco crocalor skeledirge quaxly quaxwell quaquaval lechonk oinkologne tarountula spidops nymble lokix pawmi pawmo pawmot tandemaus maushold fidough dachsbun smoliv dolliv arboliva squawkabilly nacli naclstack garganacl charcadet armarouge ceruledge tadbulb bellibolt wattrel kilowattrel maschiff mabosstiff shroodle grafaiai bramblin brambleghast toedscool toedscruel klawf capsakid scovillain rellor rabsca flittle espathra tinkatink tinkatuff tinkaton wiglett wugtrio bombirdier finizen palafin varoom revavroom cyclizar orthworm glimmet glimmora greavard houndstone flamigo cetoddle cetitan veluza dondozo tatsugiri annihilape clodsire farigiraf dudunsparce kingambit great-tusk scream-tail brute-bonnet flutter-mane slither-wing sandy-shocks iron-treads iron-bundle iron-hands iron-jugulis iron-moth iron-thorns frigibax arctibax baxcalibur gimmighoul gholdengo wo-chien chien-pao ting-lu chi-yu roaring-moon iron-valiant koraidon miraidon walking-wake iron-leaves dipplin poltchageist sinistcha okidogi munkidori fezandipita ogerpon archaludon hydrapple gouging-fire raging-bolt iron-boulder iron-crown terapagos pecharunt`];
const N=G.join(' ').split(' '),T=N.length;
const th=i=>`https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${i}.png`,art=i=>`https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/${i}.png`;
const cap=s=>s.split('-').map(w=>w[0].toUpperCase()+w.slice(1)).join(' ');
const V=['Normalna','Błyszcząca','EX','FullArt'],S=['N','B','E','F'];
let own={};try{own=JSON.parse(localStorage.getItem('own')||'{}')}catch(e){}
const save=()=>{try{localStorage.setItem('own',JSON.stringify(own))}catch(e){}};
const has=(i,v)=>((own[i]||0)>>v)&1;
const $=id=>document.getElementById(id);
const K={};N.forEach((n,i)=>{const k=n.replace(/-/g,'');if(!K[k])K[k]=i+1});
K.nidoran=29;
function find(t){t=t.toLowerCase();const tk=new Set(t.match(/[a-z]+/g)||[]),j=t.replace(/[^a-z]/g,'');let bk='';for(const k in K)if((tk.has(k)||(k.length>5&&j.includes(k)))&&k.length>bk.length)bk=k;return bk?K[bk]:0}
function tile(i){const o=own[i]?' on':'';return `<button class="t${o}" data-i="${i}"><img loading="lazy" alt="" src="${th(i)}" onerror="this.style.visibility='hidden'"><b>#${i}</b><span>${cap(N[i-1])}</span><div class="d">${S.map((s,v)=>`<u class="${has(i,v)?'y':''}">${s}</u>`).join('')}</div></button>`}
function match(q){q=q.trim().toLowerCase();const r=[];for(let i=1;i<=T;i++)if(!q||String(i)===q||N[i-1].replace(/-/g,' ').includes(q))r.push(i);return r}
function render(){
  const n=Object.keys(own).length;$('cnt').textContent=`Zebrane: ${n} / ${T}`;$('pb').style.width=(n/T*100)+'%';
  $('g').innerHTML=match($('q').value).map(tile).join('');
}
function open(i){
  stop();
  const sh=$('sh');
  sh.innerHTML=`<h1>#${i} ${cap(N[i-1])}</h1><img alt="" src="${art(i)}" style="display:block;margin:0 auto;width:min(55vw,240px);height:auto"><div class="mut">Zaznacz, jakie karty masz:</div>`+V.map((v,k)=>`<button class="v${has(i,k)?' y':''}" data-k="${k}"><span>${v}</span><span>${has(i,k)?'✓ mam':'—'}</span></button>`).join('')+`<button class="btn" id="cl" style="width:100%;margin-top:12px">Gotowe</button>`;
  sh.dataset.i=i;$('m').classList.add('o');
}
function close(){$('m').classList.remove('o');render();if(tab==1)perm()}
$('sh').onclick=e=>{
  if(e.target.id==='cl')return close();
  const b=e.target.closest('.v');if(!b)return;
  const i=+$('sh').dataset.i,k=+b.dataset.k;
  own[i]=(own[i]||0)^(1<<k);if(!own[i])delete own[i];save();open(i);
};
$('m').onclick=e=>{if(e.target.id==='m')close()};
$('g').onclick=e=>{const t=e.target.closest('.t');if(t)open(+t.dataset.i)};
$('fr').onclick=e=>{const t=e.target.closest('.t');if(t)open(+t.dataset.i)};
$('q').oninput=render;
$('f').oninput=()=>{const v=$('f').value;$('fr').innerHTML=v.trim()?match(v).slice(0,8).map(tile).join(''):''};
let tab=0,stream,facing='environment',timer;
function show(t){tab=t;$('c').classList.toggle('hide',t!==0);$('s').classList.toggle('hide',t!==1);$('n0').className=t?'':'a';$('n1').className=t?'a':'';if(t){perm()}else{stop();render()}}
$('n0').onclick=()=>show(0);$('n1').onclick=()=>show(1);
function stop(){clearInterval(timer);if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}}
async function perm(){let s='prompt';try{s=(await navigator.permissions.query({name:'camera'})).state}catch(e){}
  if(s==='granted')start();else $('msg').textContent=s==='denied'?'Aparat jest zablokowany. Odblokuj go w ustawieniach witryny (ikona przy pasku adresu) i dotknij przycisku.':'Aby skanować karty, potrzebny jest dostęp do aparatu. Dotknij „Zezwól na aparat”.'}
async function start(){
  stop();const v=$('v'),msg=$('msg');
  try{
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:facing}});
    v.srcObject=stream;await v.play();
  }catch(e){msg.textContent='Kamera nie działa ('+e.name+'). Otwórz stronę w samej przeglądarce Chrome (nie w aplikacji), zezwól na kamerę w ustawieniach witryny i dotknij „Zezwól na aparat”. Możesz też wpisać nazwę poniżej.';if(window.self!==window.top)$('ob').classList.remove('hide');return}
  if(!('TextDetector' in window)){msg.textContent='Ta przeglądarka nie czyta tekstu z kamery. Wpisz nazwę poniżej (lub włącz „Experimental Web Platform features” w chrome://flags).';return}
  msg.textContent='Pokaż kartę z widoczną nazwą Pokémona…';
  const d=new TextDetector();
  timer=setInterval(async()=>{try{const r=await d.detect(v);const i=find(r.map(x=>x.rawValue).join(' '));if(i)open(i)}catch(e){}},700);
}
$('cb').onclick=start;$('ob').onclick=()=>window.open(location.href,'_blank');$('sw').onclick=()=>{facing=facing==='environment'?'user':'environment';start()};
render();
</script></body></html>
